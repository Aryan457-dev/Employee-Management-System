<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-header bg-dark text-white text-center">

                        <h2>Update Employee</h2>

                    </div>

                    <div class="card-body p-4">

                        <form method="POST">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="first_name"
                                           value="{{ employee.first_name }}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="last_name"
                                           value="{{ employee.last_name }}"
                                           required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="username"
                                           value="{{ employee.username }}"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           name="email"
                                           value="{{ employee.email }}"
                                           required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile
                                </label>

                                <input type="text"
                                       class="form-control"
                                       name="mobile"
                                       value="{{ employee.mobile }}"
                                       required>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Department
                                    </label>

                                    <select class="form-select"
                                            name="dept_id">

                                        {% for department in departments %}

                                        <option value="{{ department.id }}"
                                        {% if employee.dept_id == department.id %}
                                        selected
                                        {% endif %}>

                                            {{ department.department_name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Role
                                    </label>

                                    <select class="form-select"
                                            name="role_id">

                                        {% for role in roles %}

                                        <option value="{{ role.id }}"
                                        {% if employee.role_id == role.id %}
                                        selected
                                        {% endif %}>

                                            {{ role.role_name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Date of Joining
                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="date_of_joining"
                                       value="{{ employee.date_of_joining }}"
                                       required>

                            </div>

                            <div class="d-grid">

                                <button type="submit"
                                        class="btn btn-dark btn-lg">

                                    Update Employee

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
