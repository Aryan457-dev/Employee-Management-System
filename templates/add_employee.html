<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-header bg-dark text-white text-center rounded-top-4">

                        <h2>Add Employee</h2>

                    </div>

                    <div class="card-body p-4">

                        <form method="POST">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="first_name"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="last_name"
                                           required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="username"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           name="password"
                                           required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           name="email"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Mobile Number
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="mobile"
                                           required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-4 mb-3">

                                    <label class="form-label">
                                        Department
                                    </label>

                                    <select class="form-select"
                                            name="dept_id">

                                        {% for department in departments %}

                                        <option value="{{ department.id }}">

                                            {{ department.department_name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-4 mb-3">

                                    <label class="form-label">
                                        Role
                                    </label>

                                    <select class="form-select"
                                            name="role_id">

                                        {% for role in roles %}

                                        <option value="{{ role.id }}">

                                            {{ role.role_name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-4 mb-3">

                                    <label class="form-label">
                                        Reporting Manager
                                    </label>

                                    <select class="form-select"
                                            name="reporting_manager_id">

                                        <option value="">
                                            Select Manager
                                        </option>

                                        {% for manager in managers %}

                                        <option value="{{ manager.employee_id }}">

                                            {{ manager.first_name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Date of Joining
                                </label>

                                <input type="date"
                                       class="form-control"
                                       name="date_of_joining"
                                       required>

                            </div>

                            <div class="d-grid">

                                <button type="submit"
                                        class="btn btn-dark btn-lg">

                                    Add Employee

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
